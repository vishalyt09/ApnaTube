name: Build ApnaTube Android APK

'on':
workflow_dispatch:
push:
branches:
- main
paths:
- "apps/user-app/**"
- ".github/workflows/build-apk.yml"

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install dependencies
    working-directory: apps/user-app
    run: npm install

  - name: Build web app
    working-directory: apps/user-app
    run: npm run build
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  - name: Add Android platform if missing
    working-directory: apps/user-app
    run: |
      if [ ! -d android ]; then
        npx cap add android
      fi

  - name: Sync Capacitor
    working-directory: apps/user-app
    run: npx cap sync android

  - name: Build debug APK
    working-directory: apps/user-app/android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ApnaTube-debug-apk
      path: apps/user-app/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
