name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/user-app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/user-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure Capacitor is installed
        run: |
          if ! npm ls @capacitor/android >/dev/null 2>&1; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi

      - name: Create .env.local from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Build web app
        run: npm run build

      - name: Init Capacitor (only if config missing)
        run: |
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            npx cap init ApnaTube com.apnatube.app --web-dir=dist
          fi

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/user-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApnaTube-debug-apk
          path: apps/user-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
