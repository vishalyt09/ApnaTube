name: Build Android APK

'on':
workflow_dispatch:
push:
branches:
- main
paths:
- "apps/user-app/**"
- ".github/workflows/build-apk.yml"

permissions:
contents: read

concurrency:
group: build-apk-${{ github.ref }}
cancel-in-progress: true

jobs:
build-debug-apk:
name: Build debug APK
runs-on: ubuntu-latest
timeout-minutes: 30

defaults:
  run:
    working-directory: apps/user-app

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check required files and secrets
    run: |
      missing=0

      for f in package.json capacitor.config.ts; do
        if [ ! -f "$f" ]; then
          echo "::error::apps/user-app/$f not found"
          missing=1
        fi
      done

      if [ -z "$VITE_SUPABASE_URL" ]; then
        echo "::error::Repository secret VITE_SUPABASE_URL is missing"
        missing=1
      fi

      if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
        echo "::error::Repository secret VITE_SUPABASE_ANON_KEY is missing"
        missing=1
      fi

      exit "$missing"

  - name: Set up Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "21"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle cache
    uses: gradle/actions/setup-gradle@v4

  - name: Install dependencies
    run: |
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi

  - name: Build web app
    run: npm run build

  - name: Add Android platform if missing
    run: |
      if [ ! -d android ]; then
        npx cap add android
      else
        echo "Android platform already exists"
      fi

  - name: Sync Capacitor
    run: npx cap sync android

  - name: Build debug APK
    working-directory: apps/user-app/android
    run: |
      chmod +x ./gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: ApnaTube-debug-apk
      path: apps/user-app/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
